services:
  - type: web
    name: kyc-arena
    plan: free
    env: node
  # Ensure devDependencies (vite, tsx, etc.) are installed during build
  # Some CI/build environments set NODE_ENV=production which causes npm to skip devDependencies.
  # Force install to include devDependencies during the build step.
  buildCommand: NPM_CONFIG_PRODUCTION=false npm install && npm run build && npm run setup-admin
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kyc-arena-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: kyc-arena-db
    plan: free
    postgresVersion: 16
